          - heading "Sarcasm and context" [level=3] [ref=f42e457]
          - paragraph [ref=f42e458]: "\"Wow, you're really a genius 🙄\" carries no abusive word. Neither does a reply that is only cruel because of what it is replying to. Both are caught."
