      - generic [ref=f29e446]:
        - generic [ref=f29e450]:
          - heading "English, Hindi and Marathi" [level=3] [ref=f29e451]
          - paragraph [ref=f29e452]: Including romanised, code-mixed comments — the "bhai yeh kya hai" register that generic toxicity models read as English and score as harmless.
        - generic [ref=f29e456]:
          - heading "Sarcasm and context" [level=3] [ref=f29e457]
          - paragraph [ref=f29e458]: "\"Wow, you're really a genius 🙄\" carries no abusive word. Neither does a reply that is only cruel because of what it is replying to. Both are caught."
        - generic [ref=f29e462]:
          - heading "Nine categories, five severities" [level=3] [ref=f29e463]
          - paragraph [ref=f29e464]: Insult, harassment, hate speech, threat, profanity, sexual content, identity attack and self-harm — each graded from mild through to critical.
        - generic [ref=f29e468]:
          - heading "It shows its working" [level=3] [ref=f29e469]
          - paragraph [ref=f29e470]: Every verdict carries its confidence, which model produced it, and where the two models disagreed. Flag anything wrong and it is measured against the next run.
