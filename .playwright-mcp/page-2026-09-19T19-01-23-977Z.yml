        - heading "What is actually happening under the hood." [level=2] [ref=f26e445]
      - generic [ref=f26e446]:
        - generic [ref=f26e450]:
          - heading "English, Hindi and Marathi" [level=3] [ref=f26e451]
          - paragraph [ref=f26e452]: Including romanised, code-mixed comments — the "bhai yeh kya hai" register that generic toxicity models read as English and score as harmless.
        - generic [ref=f26e456]:
          - heading "Sarcasm and context" [level=3] [ref=f26e457]
          - paragraph [ref=f26e458]: "\"Wow, you're really a genius 🙄\" carries no abusive word. Neither does a reply that is only cruel because of what it is replying to. Both are caught."
        - generic [ref=f26e462]:
          - heading "Nine categories, five severities" [level=3] [ref=f26e463]
          - paragraph [ref=f26e464]: Insult, harassment, hate speech, threat, profanity, sexual content, identity attack and self-harm — each graded from mild through to critical.
        - generic [ref=f26e468]:
          - heading "It shows its working" [level=3] [ref=f26e469]
          - paragraph [ref=f26e470]: Every verdict carries its confidence, which model produced it, and where the two models disagreed. Flag anything wrong and it is measured against the next run.
