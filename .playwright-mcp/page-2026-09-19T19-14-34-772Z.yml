        - paragraph [ref=f41e1157]: Capabilities
        - heading "What is actually happening under the hood." [level=2] [ref=f41e1158]
      - generic [ref=f41e1159]:
        - generic [ref=f41e1163]:
          - heading "English, Hindi and Marathi" [level=3] [ref=f41e1164]
          - paragraph [ref=f41e1165]: Including romanised, code-mixed comments — the "bhai yeh kya hai" register that generic toxicity models read as English and score as harmless.
        - generic [ref=f41e1169]:
          - heading "Sarcasm and context" [level=3] [ref=f41e1170]
          - paragraph [ref=f41e1171]: "\"Wow, you're really a genius 🙄\" carries no abusive word. Neither does a reply that is only cruel because of what it is replying to. Both are caught."
        - generic [ref=f41e1175]:
          - heading "Nine categories, five severities" [level=3] [ref=f41e1176]
          - paragraph [ref=f41e1177]: Insult, harassment, hate speech, threat, profanity, sexual content, identity attack and self-harm — each graded from mild through to critical.
        - generic [ref=f41e1181]:
          - heading "It shows its working" [level=3] [ref=f41e1182]
          - paragraph [ref=f41e1183]: Every verdict carries its confidence, which model produced it, and where the two models disagreed. Flag anything wrong and it is measured against the next run.
