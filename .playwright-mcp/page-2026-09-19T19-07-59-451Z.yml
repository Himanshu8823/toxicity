      - heading "A probability, not a verdict." [level=2] [ref=f36e58]
      - paragraph [ref=f36e59]: "Your text is routed by the language detected in it: MuRIL for Indic and code-mixed writing, XLM-RoBERTa for English and European languages, with a language model reading it again for sarcasm and severity. Each is stronger on the phrasing it was trained on and less certain outside it. Treat every result here as a probability worth reading carefully, not an automatic judgement of the person who wrote it."
