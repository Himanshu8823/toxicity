      - generic [ref=f41e446]:
        - generic [ref=f41e450]:
          - heading "English, Hindi and Marathi" [level=3] [ref=f41e451]
          - paragraph [ref=f41e452]: Including romanised, code-mixed comments — the "bhai yeh kya hai" register that generic toxicity models read as English and score as harmless.
        - generic [ref=f41e456]:
          - heading "Sarcasm and context" [level=3] [ref=f41e457]
          - paragraph [ref=f41e458]: "\"Wow, you're really a genius 🙄\" carries no abusive word. Neither does a reply that is only cruel because of what it is replying to. Both are caught."
        - generic [ref=f41e462]:
          - heading "Nine categories, five severities" [level=3] [ref=f41e463]
          - paragraph [ref=f41e464]: Insult, harassment, hate speech, threat, profanity, sexual content, identity attack and self-harm — each graded from mild through to critical.
        - generic [ref=f41e468]:
          - heading "It shows its working" [level=3] [ref=f41e469]
          - paragraph [ref=f41e470]: Every verdict carries its confidence, which model produced it, and where the two models disagreed. Flag anything wrong and it is measured against the next run.
